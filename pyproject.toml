[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Conjunto padrão do ruff (pyflakes + um núcleo de pycodestyle) --
# pega bug real (import/variável não usada, nome indefinido, erro de
# sintaxe) sem forçar reformatação em massa de um código que não foi
# escrito com o ruff em mente desde o início. Regras de estilo mais
# agressivas (pyupgrade, bugbear, isort etc.) ficam de fora por ora:
# o bugbear B008 em particular reclama de todo `= Depends(...)` como
# "chamada de função em valor padrão", que é o jeito idiomático do
# FastAPI de declarar dependência -- não é bug.
select = ["E4", "E7", "E9", "F"]
